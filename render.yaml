services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: powersched-api
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRICE_PROVIDER
        value: atlas
      - key: ATLAS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: app/database/powersched.db

  # 2. React + Vite Frontend Static Site
  - type: static
    name: powersched-frontend
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: powersched-api
          property: host
