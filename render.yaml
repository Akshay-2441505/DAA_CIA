services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: powersched-api
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRICE_PROVIDER
        value: atlas
      - key: ATLAS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: app/database/powersched.db

  # 2. React + Vite Frontend (served via Node/serve)
  - type: web
    name: powersched-frontend
    runtime: node
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: powersched-api
          property: host
